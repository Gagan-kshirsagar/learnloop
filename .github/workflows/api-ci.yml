name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-ci:
    name: API Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      LEARNLOOP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/learnloop_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff (Lint & Format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Mypy (Typecheck)
        run: uv run mypy app

      - name: Run Pytest
        run: uv run pytest

      - name: Run Tutor Evaluation Harness (Offline)
        run: uv run python -m app.modules.tutor.evals.run --offline --threshold 0.85

      - name: Run Module Boundary Check
        run: uv run python tools/check_boundaries.py
